services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: nexuscloud
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -ppassword || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s

  api:
    build: .
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=password
      - MYSQL_DATABASE=nexuscloud
      - SECRET_KEY=dev_secret_key_nexuscloud_2026
      - JWT_SECRET=dev_jwt_secret_nexuscloud_2026
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000

volumes:
  mysql_data:
