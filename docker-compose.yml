# Full-stack docker-compose for local development and AWS deployment
# Usage: docker compose up -d --build

services:
  # ── MySQL Database ──────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nexuscloud}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  api:
    build: ./backend
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${DB_ROOT_PASSWORD:-password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-nexuscloud}
      - SECRET_KEY=${SECRET_KEY:-dev_secret_key_nexuscloud_2026}
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret_nexuscloud_2026}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── React Frontend (Nginx) ──────────────────────────────────────────────────
  frontend:
    build:
      context: .
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
    restart: always
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql_data:
